server:
  port: 8092

spring:
  application:
    name: data-khaos-pipeline
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/data_khaos?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

data-khaos:
  version: 1.0.0
  jwt:
    secret: ${JWT_SECRET:data-khaos-jwt-secret-key-2026-hs256-0123456789}
  # 数据源密码 AES 解密密钥（与 datasource 服务一致）
  aes-key: ${AES_KEY:dk-aes-key-16byte}
  # 管道执行线程池参数
  pipeline:
    core-pool-size: 2
    max-pool-size: 8
    queue-capacity: 100

knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true